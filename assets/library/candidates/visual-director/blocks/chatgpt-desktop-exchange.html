      @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }

      .top-voice {

      .chev { width: 10px; height: 10px; border-right: 1.5px solid #888; border-bottom: 1.5px solid #888; transform: rotate(45deg) translateY(-3px); }
      .mic svg { width: 25px; height: 25px; fill: none; stroke: #1d1d1d; stroke-width: 2; }
      .send {
        width: 54px; height: 54px; border-radius: 50%; background: #050505; color: #fff;

      .send svg { width: 25px; height: 25px; fill: none; stroke: #fff; stroke-width: 2.2; }
      .suggestions { position: absolute; top: 575px; left: 524px; width: 1070px; display: grid; gap: 27px; }
      .suggestion { display: flex; align-items: center; gap: 20px; color: #8b8b8b; font-size: 22px; white-space: nowrap; }
      .suggestion-icon { width: 28px; text-align: center; color: #161616; }
      .conversation { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
      .thread { position: absolute; left: 320px; top: 150px; width: 1280px; height: 710px; overflow: hidden; }
      .user-bubble {
        margin-left: auto; width: fit-content; max-width: 620px; padding: 16px 25px; border-radius: 28px;

      .answer { width: 1160px; margin-top: 38px; font-size: 24px; line-height: 1.62; }

      .row {
        display: grid; grid-template-columns: 230px 180px 1fr; min-height: 70px; align-items: center;

      .row > div { padding: 15px 18px 15px 0; }
      .header { min-height: 52px; font-weight: 700; color: #353535; }
      .risk { font-weight: 700; }
      .chip {
        display: inline-flex; margin-left: 12px; padding: 3px 9px; border: 1px solid #d5d5d5;
        border-radius: 999px; color: #707070; font-size: 12px; vertical-align: 2px;

      .bottom-composer {
        position: absolute; left: 470px; top: 928px; width: 980px; height: 70px; border-radius: 38px;
        background: #fff; border: 1px solid #e8e8e8; box-shadow: 0 8px 26px rgba(0,0,0,.08);
        display: flex; align-items: center; padding: 0 14px 0 24px; opacity: 0;
      }
      .bottom-placeholder { flex: 1; color: #707070; font-size: 21px; }
      .bottom-send { width: 48px; height: 48px; border-radius: 50%; background: #050505; display: grid; place-items: center; }
      .bottom-send svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2.2; }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      const vars = window.__hyperframes && typeof window.__hyperframes.getVariables === "function" ? window.__hyperframes.getVariables() : {};
      const value = (id, fallback = "") => typeof vars[id] === "string" && vars[id].trim() ? vars[id].trim() : fallback;
      document.getElementById("cgd-root").classList.toggle("compact", value("compactMode", "false").toLowerCase() === "true");
      document.querySelector(".hero-question").textContent = value("hero", "我们先从哪里开始呢？");
      const suggestionCopy = document.querySelectorAll(".suggestion span:last-child");
      suggestionCopy[0].textContent = value("suggestion1", "分析一份周报，并找出真正影响交付的异常");
      suggestionCopy[1].textContent = value("suggestion2", "把异常整理成负责人可以立刻执行的动作");
      const prompt = value("prompt", "请判断这份周报里的异常");
      document.getElementById("cgd-user-bubble").textContent = prompt;
      document.getElementById("answer-one").textContent = value("intro1", "关键不是重讲数据，而是判断哪些异常会影响交付。");
      document.getElementById("answer-two").textContent = value("intro2", "再给负责人一个可以立刻执行的动作：");
      const headerCells = document.querySelectorAll(".table .header > div");
      headerCells[0].textContent = value("tableHeadUse", "异常");
      headerCells[1].textContent = value("tableHeadTool", "判断");
      headerCells[2].textContent = value("tableHeadWhy", "建议动作");
      const rowFallbacks = [
        ["🏅 交付延期", "高风险", "确认负责人和补救时间"],
        ["🏢 库存偏低", "需关注", "核对需求，及时补货"],
        ["📱 转化下降", "待观察", "对比渠道与活动变化"],
        ["💬 格式缺失", "低风险", "自动补齐后复核"],
      ];
      const tableRows = document.querySelectorAll(".table .row:not(.header)");
      tableRows.forEach((row, index) => {
        const cells = row.children;
        cells[0].textContent = value(`row${index + 1}Use`, rowFallbacks[index][0]);
        cells[1].textContent = value(`row${index + 1}Tool`, rowFallbacks[index][1]);
        cells[2].firstChild.textContent = `${value(`row${index + 1}Why`, rowFallbacks[index][2])} `;
      });
      const promptHost = document.getElementById("prompt-chars");
      prompt.split("").forEach((char, index) => {
        const span = document.createElement("span");
        span.className = "prompt-char";
        span.id = `cgd-prompt-${index}`;
        span.textContent = char;
        promptHost.appendChild(span);
      });

      const wrapWords = (id) => {
        const node = document.getElementById(id);
        const chars = node.textContent.split("");
        node.textContent = "";
        chars.forEach((char, index) => {
          const span = document.createElement("span");
          span.className = "answer-word";
          span.id = `${id}-${index}`;
          span.textContent = char;
          node.appendChild(span);
        });
      };
      wrapWords("answer-one");
      wrapWords("answer-two");

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".rail, .top-switch, .top-voice", { opacity: 0 }, { opacity: 1, duration: .35 }, 0);
      tl.fromTo(".hero-question", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: "power2.out" }, .2);
      tl.fromTo("#cgd-composer", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: .55, ease: "power2.out" }, .35);
      tl.fromTo(".suggestion", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: .35, stagger: .16 }, .65);
      tl.to("#cgd-home-placeholder", { opacity: 0, duration: .18 }, .88);
      tl.to(".prompt-char", { opacity: 1, duration: .01, stagger: .115 }, 1.05);
      tl.to("#cgd-cursor", { opacity: 0, duration: .08, repeat: 3, yoyo: true }, 2.35);
      tl.to("#cgd-send", { scale: .86, duration: .08, ease: "power2.out" }, 3.05);
      tl.to("#cgd-send", { scale: 1, duration: .16, ease: "power2.out" }, 3.13);
      tl.to(".hero-question, .suggestions", { opacity: 0, y: -18, duration: .28 }, 3.18);
      tl.to("#cgd-composer", { opacity: 0, y: 16, duration: .24 }, 3.2);
      tl.set(".home-state", { autoAlpha: 0 }, 3.42);
      tl.set("#cgd-conversation", { autoAlpha: 1 }, 3.42);
      tl.fromTo("#cgd-user-bubble", { y: 18, opacity: 0, scale: .96 }, { y: 0, opacity: 1, scale: 1, duration: .4, ease: "power2.out" }, 3.48);
      tl.fromTo("#cgd-bottom-composer", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: .36, ease: "power2.out" }, 3.56);
      tl.to("#answer-one .answer-word", { opacity: 1, duration: .055, stagger: .075 }, 4.05);
      tl.to("#answer-two .answer-word", { opacity: 1, duration: .055, stagger: .075 }, 6.55);
      tl.fromTo(".row", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .42, stagger: .52, ease: "power2.out" }, 8.05);
      tl.to("#cgd-thread", { y: -34, duration: .65, ease: "power2.inOut" }, 12.25);
      window.__timelines["chatgpt-desktop-exchange"] = tl;
    </script>
