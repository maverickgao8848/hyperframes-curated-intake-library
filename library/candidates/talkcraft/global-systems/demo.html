<!doctype html>
<html lang="en" data-composition-variables="[]">
<head><meta charset="utf-8"><meta name="viewport" content="width=1920, height=1080"></head>
<body>
<template>
  <script src="gsap.min.js"></script>
  <script src="talkcraft-systems.js"></script>
  <style>
    #tc-system-demo{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#10151a;color:#fff;font-family:Arial,sans-serif}
    .environment{position:absolute;inset:-10%;opacity:.55;background:radial-gradient(circle at 35% 30%,#315b64,transparent 35%),radial-gradient(circle at 72% 70%,#4b345c,transparent 32%),#10151a;background-size:120% 120%}
    .camera{position:absolute;inset:150px 250px;transform:translate(0,0) scale(1) rotate(0deg);transform-origin:50% 50%}
    .plane{position:absolute;width:920px;height:520px;border:1px solid #7f929d;background:#182129;box-shadow:0 30px 90px #0008;transform:translate(0,0)}
    .plane.back{left:160px;top:100px;opacity:.35}.plane.front{left:320px;top:230px;padding:70px;font-size:72px;font-weight:800}
    .focus-target{display:inline-block}.mask-card{position:absolute;right:170px;bottom:120px;width:500px;padding:45px;background:#d7ff3f;color:#101214;font-size:32px;clip-path:inset(0 100% 0 0)}
  </style>
  <div id="tc-system-demo" data-composition-id="talkcraft-global-systems-demo" data-start="0" data-duration="8" data-fps="60" data-width="1920" data-height="1080">
    <div class="environment"></div><div class="camera"><div class="plane back" data-depth=".35"></div><div class="plane front" data-depth="1"><span class="focus-target">P0 SYSTEMS</span></div></div><div class="mask-card">Native, seek-safe candidates</div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    const tl=gsap.timeline({paused:true});
    TalkCraftSystems.environment(tl,".environment",0,8);
    TalkCraftSystems.cameraRig(tl,".camera",[{time:0,x:0,y:0,scale:1},{time:4,x:-90,y:-30,scale:1.12},{time:8,x:-120,y:-15,scale:1.16}]);
    TalkCraftSystems.parallax(tl,document.querySelectorAll(".plane"),0,8,34);
    TalkCraftSystems.live(tl,".focus-target",1,4,7);
    TalkCraftSystems.defocus(tl,".plane.back",3.2,.5,12,.25);
    TalkCraftSystems.mask(tl,".mask-card",5,.8,"right");
    window.__timelines["talkcraft-global-systems-demo"]=tl;
  </script>
</template>
</body></html>
